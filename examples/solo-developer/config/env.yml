# Where the bot runs + the GitHub App slug.

runner_tier: actions-free

# Default; only change if you publish 'classifier-judgment' check-runs from
# a non-default GitHub App.
classifier_publisher_slug: github-actions

# Replace with the slug of YOUR GitHub App (lowercase, hyphenated). After
# you register the App via the wizard's manifest URL, GitHub assigns this
# slug — usually a variation of the name you chose.
bot_app_slug: your-merge-gate-bot

# CI posture — make ONE conscious choice (otherwise every tick logs a
# C2-posture warning):
#   required_checks: ["test"]   # name the checks that must pass (strictest)
#   allow_no_ci: true           # repo has no CI by design → vacuous C2 (opt-in)
# Leaving both unset = "any completed check must succeed; zero checks blocks".

# L2 auto-revert PR (opt-in, default off). When true, a post-merge re-validation
# real-failure ALSO opens a revert PR (branch revert/<bad-sha7>) in the
# supervised repo and links it in the incident issue. The revert PR still goes
# through the normal merge gate (it is NOT auto-approved). Requires the App to
# have contents:write + pull_requests:write. See
# docs/decisions/0002_auto_revert_pr.md.
#   auto_revert_pr: true

# L4 60-day burn-in auto-promotion (opt-in, default 0 = off). A positive int N
# promotes the registry gate (validator_agent_registry) from advisory to a hard
# block N days after it first goes advisory — unless you pin its severity via
# skills.yml severity_overrides (explicit config always wins). See
# docs/decisions/0003_l4_burn_in.md.
#   l4_burn_in_days: 60
