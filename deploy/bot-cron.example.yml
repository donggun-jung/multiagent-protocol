# bot-cron — DEPLOYED workflow for a PRIVATE governance repo.
#
# This is the file your installation actually runs. Copy it over the
# framework's dispatch-only workflow in YOUR private governance repo:
#
#     cp deploy/bot-cron.example.yml .github/workflows/bot-cron.yml
#
# (Upstream's own .github/workflows/bot-cron.yml is dispatch-only on purpose:
# the public framework repo must never run a merge engine. Your governance
# repo is where the engine lives. See docs/agent-setup/AGENT_SETUP.md step 3.)
#
# GitHub App permissions this workflow's App must hold (manual-registration
# fallback; the wizard manifest sets the same): Repository permissions —
# Contents: Read&write · Pull requests: Read&write · Issues: Read&write ·
# Checks: Read&write · Actions: Read · Workflows: Read · Metadata: Read.
#
# Secrets consumed (set via `gh secret set`, AGENT_SETUP step 4):
#   MERGE_GATE_APP_ID        — the App's numeric id
#   MERGE_GATE_PRIVATE_KEY   — the App's full RSA PEM (BEGIN/END lines included)
#   MERGE_GATE_RECEIPT_KEY   — HMAC key for approval receipts / inbox integrity
# Variable consumed (set via `gh variable set`, AGENT_SETUP step 8):
#   MERGE_GATE_MERGE_ENABLED — 'false' = observe mode (default), 'true' = live

name: bot-cron

on:
  schedule:
    # CRON: pick a cadence you can afford — a tick costs ~30-60s of runner time.
    #   */5  ≈ 72-144 h/month  → self-hosted runners only
    #   */15 ≈ 24-48 h/month   → borderline on GitHub Free (2,000 min, private)
    #   */30 ≈ 12-24 h/month   → default for GitHub Actions Free
    #   0 *  ≈ 6-12 h/month    → slowest reaction, cheapest
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # manual backstop — cron lag and 60-day auto-disable are real

concurrency:
  group: bot-cron
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  tick:
    # Self-hosted instead? Replace with: [self-hosted, multiagent-protocol]
    # and read docs/guide/self-hosted-runner.md (env reuse caveats included).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHAs pinned to the same versions the framework's own CI uses.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.12"

      - name: Install the engine from this checkout
        # Your governance repo IS the framework (a private mirror), so the
        # checkout is the engine source — an editable install always runs
        # exactly the code your repo carries. No version pinning needed here:
        # upgrading = merging upstream into your mirror (AGENT_SETUP step 1).
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e . --quiet

      - name: Run one tick
        env:
          MERGE_GATE_APP_ID: ${{ secrets.MERGE_GATE_APP_ID }}
          MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
          MERGE_GATE_RECEIPT_KEY: ${{ secrets.MERGE_GATE_RECEIPT_KEY }}
          # Observe mode until you consciously flip the variable (step 8).
          MERGE_GATE_MERGE_ENABLED: ${{ vars.MERGE_GATE_MERGE_ENABLED || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Repo root = working dir: the engine reads config/, schemas/ and
          # bot-state/ as repo-root-relative paths. With config/ present but
          # secrets missing, the tick fails loudly rather than gating nothing.
          python -m multiagent_protocol tick

      - name: Upload tick artifact (audit + metrics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tick-${{ github.run_id }}
          path: bot-state/
          if-no-files-found: ignore
          retention-days: 14   # audit trails can quote PR titles — short window
