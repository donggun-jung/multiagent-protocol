name: bot-cron

# DISPATCH-ONLY. Production ticks run from the operator's PRIVATE governance
# repo using deploy/bot-cron.example.yml (which carries the schedule, cadence
# guidance, and env wiring) — NOT from this public repo, which
# ships no deploy config or secrets, so a scheduled tick here is only a no-op
# that burns Actions minutes. Do NOT add MERGE_GATE_* secrets + config/ here:
# that would arm a second, GitHub-hosted merge engine. Manual workflow_dispatch
# remains for demos / smoke tests.
on:
  workflow_dispatch:

# Only one tick at a time, even if a previous tick over-runs.
concurrency:
  group: bot-cron
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHAs pinned (supply chain); kept in step with tests.yml + Dependabot.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.4.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run one tick
        env:
          MERGE_GATE_APP_ID: ${{ secrets.MERGE_GATE_APP_ID }}
          MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
        run: |
          python -m multiagent_protocol tick
      - name: Upload tick artifact (audit + metrics)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tick-${{ github.run_id }}
          path: |
            bot-state/
            *.log
          if-no-files-found: ignore
          retention-days: 90
