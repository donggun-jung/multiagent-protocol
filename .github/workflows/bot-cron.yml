name: bot-cron

# Runs the bot every 5 minutes. Operators select the runner via
# config/env.yml `runner_tier`; this workflow uses GitHub Actions Free
# (ubuntu-latest) by default. For self-hosted, replace the runs-on
# selector with `[self-hosted, multiagent-protocol]`.

# DISPATCH-ONLY. Production ticks run from the PRIVATE governance/deploy repo
# (e.g. company-operations) on its own runner — NOT from this public repo, which
# ships no deploy config or secrets, so a scheduled tick here is only a no-op
# that burns Actions minutes. Do NOT add MERGE_GATE_* secrets + config/ here:
# that would arm a second, GitHub-hosted merge engine. Manual workflow_dispatch
# remains for demos / smoke tests.
on:
  workflow_dispatch:

# Only one tick at a time, even if a previous tick over-runs.
concurrency:
  group: bot-cron
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHAs pinned (supply chain); kept in step with tests.yml + Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run one tick
        env:
          MERGE_GATE_APP_ID: ${{ secrets.MERGE_GATE_APP_ID }}
          MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
        run: |
          python -m multiagent_protocol tick
      - name: Upload tick artifact (audit + metrics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tick-${{ github.run_id }}
          path: |
            bot-state/
            *.log
          if-no-files-found: ignore
          retention-days: 90
