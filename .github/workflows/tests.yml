name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout@v4.2.2 — pinned to immutable commit SHA (supply chain).
      # Dependabot keeps these up-to-date via .github/dependabot.yml.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff
        run: ruff check src/ tests/

  no-personal-data:
    # Heuristic scan: refuse to merge a PR that introduces hardcoded personal
    # data outside docs/examples. Patterns scanned:
    #   - email addresses in source code (not in docs/, examples/, or this file)
    #   - public IPv4 addresses in source code (private ranges OK)
    #   - SSH-style aliases (Host <name>) in source code
    #   - cloud credentials (AWS access key, GCP key, GitHub PAT prefixes)
    # Patterns are intentionally generic — no real predecessor data is encoded
    # here. Forks should keep this job as-is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.11"
      - name: Scan
        run: |
          python3 .github/scripts/scan_no_personal_data.py
