name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout@v4.2.2 — pinned to immutable commit SHA (supply chain).
      # Dependabot keeps these up-to-date via .github/dependabot.yml.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5.4.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff
        run: ruff check src/ tests/

  no-personal-data:
    # Heuristic scan: refuse to merge a PR that introduces hardcoded personal
    # data outside docs/examples. Patterns scanned:
    #   - email addresses in source code (not in docs/, examples/, or this file)
    #   - public IPv4 addresses in source code (private ranges OK)
    #   - SSH-style aliases (Host <name>) in source code
    #   - cloud credentials (AWS access key, GCP key, GitHub PAT prefixes)
    # Patterns are intentionally generic — no real predecessor data is encoded
    # here. Forks should keep this job as-is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5.4.0
        with:
          python-version: "3.11"
      - name: Scan
        run: |
          python3 .github/scripts/scan_no_personal_data.py

  no-config-in-public:
    # Personal config (config/) must never be committed to a PUBLIC repo. In
    # this framework's public upstream, config/ is git-ignored and only
    # config/README.md is tracked. A PRIVATE deployment fork commits its own
    # config/ and is exempt — this job is skipped when the repo is private.
    # See docs/concepts/configuration-model.md.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Refuse tracked personal config in a public repo
        run: |
          tracked="$(git ls-files config/ | grep -vx 'config/README.md' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Personal config must not be committed to a PUBLIC repo:"
            printf '  %s\n' $tracked
            echo "config/ is your PRIVATE layer — see docs/concepts/configuration-model.md"
            exit 1
          fi
          echo "OK: config/ holds no tracked personal files in this public repo."
