name: docs

# Build docs/ with Jekyll and deploy to GitHub Pages on every push to main.
#
# Previously this workflow used `upload-pages-artifact` on the raw `docs/`
# directory, which serves .md files as Content-Type: text/markdown — first-
# time visitors see raw `# Heading` text. The Jekyll build (driven by
# docs/_config.yml) renders the markdown as HTML.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
