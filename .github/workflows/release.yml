name: release

# Fires when a version tag is pushed. The Docker image publishes for every
# v* tag. PyPI publishing requires BOTH a v1+ tag AND the repo variable
# PYPI_PUBLISH_ENABLED=true — set the variable only after configuring the
# trusted publisher on PyPI, so a tag can never fail red on a publisher that
# does not exist yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI (trusted publishing)
    # Gate 1: no pre-1.0 v0.x tag ever publishes.
    # Gate 2: PYPI_PUBLISH_ENABLED repo variable — flip to 'true' only AFTER
    # the trusted publisher exists (https://pypi.org/manage/account/publishing/).
    if: ${{ !startsWith(github.ref_name, 'v0.') && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing — NO token stored in the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5.4.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        # Trusted publishing: configure the publisher once on PyPI
        # (https://pypi.org/manage/account/publishing/) — no API token in the
        # repo. To use a token instead, add
        #   with: { password: ${{ secrets.PYPI_API_TOKEN }} }
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  docker:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io via the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - name: Build + push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
